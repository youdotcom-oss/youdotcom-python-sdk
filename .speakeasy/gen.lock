examples:
  AgentsRuns:
    express_batch:
      requestBody:
        application/json: {"agent": "express", "input": "What is the capital of France?", "stream": false}
      responses:
        "200":
          application/json: {"agent": "express", "mode": "express", "input": [{"role": "user", "content": "What is the capital of France?"}], "output": []}
        "400":
          application/json: {"detail": "Invalid or expired API key"}
        "401":
          application/json: {"detail": "Invalid or expired API key"}
        "422":
          application/json: {"detail": [{"type": "model_attributes_type", "loc": ["body", "tools", 0], "msg": "Input should be a valid dictionary or object to extract fields from", "input": "web_search"}]}
    express_stream:
      requestBody:
        application/json: {"agent": "express", "input": "What are some great recipes I can make in under half an hour", "stream": true, "tools": [{"type": "web_search"}]}
      responses:
        "200":
          application/json: {"agent": "express", "mode": "express", "input": [{"role": "user", "content": "What is the capital of France?"}], "output": []}
        "400":
          application/json: {"detail": "Invalid or expired API key"}
        "401":
          application/json: {"detail": "Invalid or expired API key"}
        "422":
          application/json: {"detail": [{"type": "model_attributes_type", "loc": ["body", "tools", 0], "msg": "Input should be a valid dictionary or object to extract fields from", "input": "web_search"}]}
