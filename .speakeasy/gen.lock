examples:
  post_/v1/agents/runs:
    speakeasy-default-post-/v1-/agents/runs:
      requestBody:
        application/json: {"agent": "<value>", "input": "<value>", "stream": false}
      responses:
        "200":
          application/json: {"output": [{"type": "web_search.results, message.answer", "text": "The capital of France is Paris.", "content": ["<value 1>", "<value 2>", "<value 3>"], "agent": "express"}]}
        "400":
          application/json: {"errors": []}
        "401":
          application/json: {"errors": []}
        "403":
          application/json: {"errors": [{"status": "403", "code": "tool_not_allowed", "title": "Tool not allowed", "detail": "You are not allowed to use the requested tool for this agent or tenant."}]}
  post_/v1/contents:
    missingApiKey:
      requestBody:
        application/json: {"urls": ["https://www.you.com"], "format": "html"}
      responses:
        "401":
          application/json: {"detail": "API key is required"}
    invalidOrExpired:
      requestBody:
        application/json: {"urls": ["https://www.you.com"], "format": "html"}
      responses:
        "401":
          application/json: {"detail": "Invalid or expired API key"}
    otherAuthParsing:
      requestBody:
        application/json: {"urls": ["https://www.you.com"], "format": "html"}
      responses:
        "401":
          application/json: {"detail": "<error message>"}
    missingScopes:
      requestBody:
        application/json: {"urls": ["https://www.you.com"], "format": "html"}
      responses:
        "403":
          application/json: {"detail": "Missing required scopes"}
    authFailure:
      requestBody:
        application/json: {"urls": ["https://www.you.com"], "format": "html"}
      responses:
        "500":
          application/json: {"detail": "Internal authentication error"}
    authorizationFailure:
      requestBody:
        application/json: {"urls": ["https://www.you.com"], "format": "html"}
      responses:
        "500":
          application/json: {"detail": "Internal authorization error"}
