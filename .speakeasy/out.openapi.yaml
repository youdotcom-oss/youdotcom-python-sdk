    SafeSearch:
      type: string
      title: SafeSearch
      enum:
        - 'off'
        - moderate
        - strict
      description: Configures the safesearch filter for content moderation. This allows you to decide whether to return NSFW content or not.
    LiveCrawl:
      type: string
      title: LiveCrawl
      enum:
        - web
        - news
        - all
      description: Indicates which section(s) of search results to livecrawl and return full page content.
    LiveCrawlFormatsItems:
      type: string
      title: LiveCrawlFormatsItems
      enum:
        - html
        - markdown
    LiveCrawlFormats:
      type: array
      items:
        $ref: '#/components/schemas/LiveCrawlFormatsItems'
      title: LiveCrawlFormats
      description: 'Indicates the format(s) of the livecrawled content. Pass one or both values (`html`, `markdown`). In a GET request, repeat the parameter: `?livecrawl_formats=html&livecrawl_formats=markdown`. In a POST body, provide a JSON array: `["html", "markdown"]`.'
    CrawlTimeout:
      type: integer
      title: CrawlTimeout
      description: Maximum time in seconds to wait for page content when `livecrawl` is enabled. Must be between 1 and 60 seconds. Default is 10 seconds.
      default: 10
    Contents:
      type: object
      properties:
        html:
          type: string
          description: The HTML content of the page.
        markdown:
          type: string
          description: The Markdown content of the page.
      title: Contents
      description: Contents of the page if livecrawl was enabled.
    WebResult:
      type: object
      properties:
