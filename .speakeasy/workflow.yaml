workflowVersion: 1.0.0
speakeasyVersion: latest
sources:
    You.com API:
        inputs:
            - location: https://you.com/specs/openapi_unified_agents.yaml
            - location: https://you.com/specs/openapi_search_v1.yaml
            - location: https://you.com/specs/openapi_contents.yaml
            - location: https://you.com/specs/openapi_base.yaml
            - location: https://you.com/specs/openapi_research.yaml
        overlays:
            - location: ./overlays/python_overlay.yaml
        output: .speakeasy/out.openapi.yaml
        registry:
            location: registry.speakeasyapi.dev/youcom/python-sdk/you-com-search-api
targets:
    you:
        target: python
        source: You.com API
        publish:
            pypi:
                token: $pypi_token
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/youcom/python-sdk/you-com-search-api-code-samples
            labelOverride:
                fixedValue: Python (SDK)
            blocking: false
        testing:
            enabled: false
