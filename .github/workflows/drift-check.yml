name: drift-check

on:
  schedule:
    # Every Monday at 9:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run drift check
        id: drift
        run: |
          set +e
          OUTPUT=$(python scripts/check_drift.py --strict --verbose 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          # Save output to GITHUB_ENV for downstream steps
          {
            echo "DRIFT_OUTPUT<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open issue on drift
        if: steps.drift.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_OUTPUT: ${{ env.DRIFT_OUTPUT }}
        run: |
          # Create drift label if it doesn't exist
          gh label create drift --color FBCA04 --description "SDK drift from OpenAPI specs" 2>/dev/null || true
          gh issue create \
            --title "SDK drift detected: OpenAPI specs vs SDK surface" \
            --body "The weekly drift check found differences between the You.com OpenAPI specs and the SDK.

          \`\`\`
          ${DRIFT_OUTPUT}
          \`\`\`

          Review the warnings above and update the SDK as needed. Run \`python scripts/check_drift.py --verbose\` locally to reproduce." \
            --label "drift"

      - name: Report fetch error
        if: steps.drift.outputs.exit_code == '2'
        run: |
          echo "Drift check failed (fetch error, not drift):"
          echo "${{ env.DRIFT_OUTPUT }}"

      - name: Close stale drift issues
        if: steps.drift.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Close any open drift issues since no drift was detected
          gh issue list --label "drift" --state open --json number --jq '.[].number' | while read -r num; do
            gh issue close "$num" --comment "No drift detected in the latest check. Closing."
          done
