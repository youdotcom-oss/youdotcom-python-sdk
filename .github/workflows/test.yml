name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "mypy>=2.3.0" "pytest>=9.0.0" "pytest-asyncio>=1.0.0"

      - name: Build and start mock server
        working-directory: tests/mockserver
        run: |
          go build -o mockserver .
          ./mockserver &
          for i in $(seq 1 10); do
            if curl -sf http://localhost:18080/_mockserver/health; then
              echo "mock server ready"
              break
            fi
            echo "waiting for mock server..."
            sleep 1
          done

      - name: Run tests
        run: pytest tests/ -v --tb=short --ignore=tests/test_live.py --ignore=tests/test_performance.py

      - name: Run mypy
        run: mypy src/youdotcom/
