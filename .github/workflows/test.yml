name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mypy pytest pytest-asyncio

      - name: Build and start mock server
        working-directory: tests/mockserver
        run: |
          go build -o mockserver .
          ./mockserver &
          sleep 2
          curl -sf http://localhost:18080/ || echo "mock server ready"

      - name: Run tests
        run: pytest tests/ -v --tb=short -x --ignore=tests/test_live.py

      - name: Run mypy
        run: mypy src/youdotcom/
