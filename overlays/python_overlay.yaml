overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Python Specific Modifications
  version: 1.1.0
actions:
  # Restore the top-level spec title — the frontend spec changed info.title
  # to "You.com Finance Research API" which mislabels the entire SDK in the
  # regenerated README summary. Keep it as "You.com API".
  - target: $["info"]["title"]
    update: "You.com API"
  - target: $["paths"]["/v1/contents"]["post"]
    update:
      tags:
        - contents
      x-speakeasy-name-override: generate
  - target: $["paths"]["/v1/search"]["get"]
    update:
      tags:
        - search
      x-speakeasy-name-override: unified
  - target: $["paths"]["/v1/agents/runs"]["post"]
    update:
      tags:
        - agents.runs
      x-speakeasy-name-override: create
  # Allow extras on the anonymous object branch of `output.content` so
  # `output_schema=` requests preserve the structured payload through SDK
  # unmarshal (today: `class Content(BaseModel): pass` drops everything
  # due to pydantic `extra="ignore"`). Reviewed as part of Step 4i-9.
  - target: $["components"]["schemas"]["ResearchResponse"]["properties"]["output"]["properties"]["content"]["oneOf"][1]
    update:
      additionalProperties: true
  # Same fix for the REQUEST side: `output_schema` is an inline `type: object`
  # schema (no `$ref`), so Speakeasy generates an empty `OutputSchema` pydantic
  # class that drops all `additionalProperties` (i.e., the JSON Schema fields the
  # server actually consumes). Without this overlay, the request body arrives
  # at the server as `{}` and we get a 422 ("Structured output schema root must
  # be an object"). Reviewed as part of 2.4.0 final QA.
  - target: $["paths"]["/v1/research"]["post"]["requestBody"]["content"]["application/json"]["schema"]["properties"]["output_schema"]
    update:
      additionalProperties: true
  # Remove the `authors` field from the web search result schema.
  # David requested removing it from the v1/v0 web search response spec;
  # the overlay makes this regen-durable until the upstream spec drops it.
  - target: $["components"]["schemas"]["WebResult"]["properties"]["authors"]
    remove: true
  # Background-mode research: TaskDetail.result is an inline object schema
  # that Speakeasy generates as `class Result(BaseModel): pass`, which
  # round-trips as an empty dict. Inject additionalProperties: true so the
  # full ResearchResponse payload (output.content, sources, etc.) survives
  # deserialization. The Result model in taskdetail.py already has
  # extra="allow"; this overlay ensures future regens preserve it.
  - target: $["components"]["schemas"]["TaskDetail"]["properties"]["result"]
    update:
      additionalProperties: true
  # Same fix for TaskDetail.input: the server stores the original request
  # as a Dict[str, Any] (input, research_effort, source_control, etc.) but
  # Speakeasy generates an empty TaskDetailInput BaseModel that drops all
  # fields. Inject additionalProperties: true so the input round-trips.
  # The TaskDetailInput model in taskdetail.py already has extra="allow".
  - target: $["components"]["schemas"]["TaskDetail"]["properties"]["input"]
    update:
      additionalProperties: true
  # Add the `frontier` research_effort tier to the ResearchEffort enum.
  # Frontier is a long-running, higher-quality tier that only works with
  # the task-based (background=true) API. The upstream spec doesn't yet
  # include it, so this overlay injects the enum value and updates the
  # description to document the new tier. Regen-durable: future Speakeasy
  # regenerations will pick up `frontier` from the overlay-applied spec.
  - target: $["components"]["schemas"]["ResearchEffort"]["enum"]
    update:
      - lite
      - standard
      - deep
      - exhaustive
      - frontier
  - target: $["components"]["schemas"]["ResearchEffort"]["description"]
    update: >-
      Controls how much time and effort the Research API spends on your
      question. Higher effort levels run more searches and dig deeper into
      sources, at the cost of a longer response time.

      Available levels:
      - `lite`: Returns answers quickly. Good for straightforward questions
        that just need a fast, reliable answer.
      - `standard`: The default. Balances speed and depth, a good fit for
        most questions.
      - `deep`: Spends more time researching and cross-referencing sources.
        Use this when accuracy and thoroughness matter more than speed.
      - `exhaustive`: The most thorough option. Explores the topic as fully
        as possible, best suited for complex research tasks where you want
        the highest quality result.
      - `frontier`: The highest-quality tier. Runs over longer durations
        with improved quality and accuracy. Only works with the task-based
        API (`background=true`); sending `frontier` without `background=true`
        returns a 422.
  # Add the `lite` research_effort tier to the FinanceResearchEffort enum.
  # The upstream spec doesn't yet include it, so this overlay injects the
  # enum value and updates the description. Regen-durable.
  - target: $["components"]["schemas"]["FinanceResearchEffort"]["enum"]
    update:
      - lite
      - deep
      - exhaustive
  - target: $["components"]["schemas"]["FinanceResearchEffort"]["description"]
    update: >-
      Controls how much time and effort the Finance Research API spends on
      your question. Higher effort levels run more searches and dig deeper
      into sources, at the cost of a longer response time.

      Available levels:
      - `lite`: Returns answers quickly. Good for straightforward financial
        questions that just need a fast, reliable answer.
      - `deep`: The default. Spends more time researching and
        cross-referencing sources. Good for most financial questions,
        including multi-company comparisons, earnings analysis, and
        regulatory research.
      - `exhaustive`: The most thorough option. Explores the topic as fully
        as possible, best suited for complex financial research tasks where
        you want the highest quality result.
